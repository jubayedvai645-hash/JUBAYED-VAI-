<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আমার AI অ্যাসিস্ট্যান্ট</title>
<style>
  body{font-family:sans-serif;margin:0;background:#f0f2f5;display:flex;flex-direction:column;height:100vh}
  header{background:#4f46e5;color:#fff;padding:14px;text-align:center;font-size:18px}
  #chat{flex:1;overflow-y:auto;padding:12px}
  .msg{max-width:85%;padding:10px 14px;margin:8px 0;border-radius:14px;white-space:pre-wrap;line-height:1.5}
  .user{background:#4f46e5;color:#fff;margin-left:auto}
  .bot{background:#fff;color:#222}
  footer{display:flex;gap:6px;padding:10px;background:#fff}
  input{flex:1;padding:12px;border:1px solid #ccc;border-radius:20px;font-size:16px}
  button{border:none;background:#4f46e5;color:#fff;border-radius:20px;padding:0 16px;font-size:16px}
</style>
</head>
<body>
<header>🤖 আমার AI অ্যাসিস্ট্যান্ট</header>
<div id="chat"></div>
<footer>
  <input id="q" placeholder="এখানে লিখুন...">
  <button id="mic">🎤</button>
  <button id="send">পাঠান</button>
</footer>
<script>
const chat=document.getElementById('chat'), q=document.getElementById('q');
function add(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function send(){
  const text=q.value.trim(); if(!text) return;
  add(text,'user'); q.value='';
  const w=add('ভাবছি...','bot');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const j=await r.json(); w.textContent=j.reply||'উত্তর পাওয়া যায়নি';
  }catch(e){w.textContent='সংযোগে সমস্যা হয়েছে'}
}
document.getElementById('send').onclick=send;
q.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
document.getElementById('mic').onclick=()=>{
  if(!SR){alert('এই ব্রাউজারে ভয়েস সাপোর্ট নেই');return}
  const r=new SR(); r.lang='bn-BD'; r.onresult=e=>{q.value=e.results[0][0].transcript;send()}; r.start();
};
</script>
</body>
</html>
